name: MSVC

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msvc:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: SDL2 x64
            platform: x64
            build_config: Release-SDL2

    name: MSVC (${{ matrix.name }})
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: cmd
        run: script\windows\install_packages.bat

      - name: Install MSYS2 tools
        shell: cmd
        run: C:\msys64\usr\bin\pacman.exe -S --noconfirm --noprogressbar gettext-devel make

      - name: Generate version information
        shell: bash
        run: echo "FHEROES2APPVERSION=$(cat version.txt)" >> "$GITHUB_ENV"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build fheroes2
        shell: bash
        run: MSBuild.exe fheroes2-vs2019.vcxproj /property:Platform=${{ matrix.platform }} /property:Configuration=${{ matrix.build_config }}
