name: MSVC

'on':
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  msvc:
    name: MSVC Windows x64
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: cmd
        run: script\windows\install_packages.bat

      - name: Install MSYS2 tools
        shell: cmd
        run: C:\msys64\usr\bin\pacman.exe -S --noconfirm --noprogressbar gettext-devel make

      - name: Generate version information
        shell: bash
        run: echo "FHEROES2APPVERSION=$(cat version.txt)" >> "$GITHUB_ENV"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build fheroes2
        shell: bash
        run: |
          MSBuild.exe fheroes2-vs2019.vcxproj /property:Platform=x64 /property:Configuration=Release-SDL2 /property:BuildProjectReferences=true

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: fheroes2-windows-x64-SDL2
          path: '**/fheroes2.exe'
          if-no-files-found: error
