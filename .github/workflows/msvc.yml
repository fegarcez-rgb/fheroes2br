name: MSVC

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  msvc:
    name: MSVC (${{ matrix.name }})
    runs-on: windows-2022
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: SDL2 x64
            platform: x64
            build_config: Release-SDL2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: cmd
        run: script\windows\install_packages.bat

      - name: Install MSYS2 tools
        shell: cmd
        run: C:\msys64\usr\bin\pacman.exe -S --noconfirm --noprogressbar gettext-devel make

      - name: Generate version information
        shell: bash
        run: echo "FHEROES2APPVERSION=$(cat version.txt)" >> "$GITHUB_ENV"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build fheroes2
        shell: bash
        run: |
          MSBuild.exe fheroes2-vs2019.vcxproj \
            /property:Platform=${{ matrix.platform }} \
            /property:Configuration=${{ matrix.build_config }} \
            /property:BuildProjectReferences=true

      - name: Package game
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = Get-ChildItem -Path . -Filter fheroes2.exe -Recurse -File |
            Where-Object { $_.FullName -notmatch '[\\/](package|\.git)[\\/]' } |
            Select-Object -First 1

          if (-not $exe) {
            throw "fheroes2.exe não foi encontrado após a compilação."
          }

          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item $exe.FullName package/fheroes2.exe -Force

          $sourceRoot = (Get-Location).Path
          $data = Join-Path $sourceRoot "DATA"
          $maps = Join-Path $sourceRoot "MAPS"

          if (Test-Path $data) {
            Copy-Item $data package/ -Recurse -Force
          }

          if (Test-Path $maps) {
            Copy-Item $maps package/ -Recurse -Force
          }

          foreach ($dir in @("ANIM", "MUSIC", "files")) {
            $source = Join-Path $sourceRoot $dir
            if (Test-Path $source) {
              Copy-Item $source package/ -Recurse -Force
            }
          }

          Write-Host "Executável copiado de: $($exe.FullName)"
          Write-Host "Conteúdo do pacote:"
          Get-ChildItem package -Recurse

      - name: Upload game ZIP
        uses: actions/upload-artifact@v4
        with:
          name: fheroes2-windows-x64-SDL2
          path: package/
          if-no-files-found: error
