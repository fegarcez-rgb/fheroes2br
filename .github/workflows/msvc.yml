name: MSVC

on: workflowcall: workflowdispatch:

permissions: contents: read

jobs: msvc: strategy: fail-fast: false matrix: include: - name: SDL2 x86 platform: x86 buildconfig: Release-SDL2 deployconfig: SDL2 installerpackagename: fheroes2windowsx86SDL2installer.exe zippackagename: fheroes2windowsx86SDL2.zip toolspackagename: fheroes2toolswindowsx86SDL2.zip - name: SDL2 x64 platform: x64 buildconfig: Release-SDL2 deployconfig: SDL2 installerpackagename: fheroes2windowsx64SDL2installer.exe zippackagename: fheroes2windowsx64SDL2.zip toolspackagename: fheroes2toolswindowsx64SDL2.zip

name: MSVC (${{ matrix.name }}) runs-on: windows-2022 timeout-minutes: 45

defaults: run: shell: bash

steps: - uses: actions/checkout@v4

- name: Install dependencies run: script/windows/install_packages.bat

- name: Install MSYS2 tools shell: cmd run: C:\msys64\usr\bin\pacman.exe -S --noconfirm --noprogressbar gettext-devel make

- name: Download MSVC Redistributable package shell: cmd env: VCREDISTURL: https://aka.ms/vs/17/release/vcredist.${{ matrix.platform }}.exe run: | mkdir .vcredist C:\msys64\usr\bin\wget.exe -O .vcredist/vcredist.exe "%VCREDIST_URL%"

