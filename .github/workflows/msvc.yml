name: MSVC

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows
    runs-on: windows-2022

    steps:
      - name: Baixar código-fonte
        uses: actions/checkout@v4

      - name: Instalar dependências
        shell: cmd
        run: script\windows\install_packages.bat

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Compilar fheroes2
        shell: cmd
        run: MSBuild.exe fheroes2-vs2019.vcxproj /property:Platform=x64 /property:Configuration=Release-SDL2

      - name: Publicar executável
        uses: actions/upload-artifact@v4
        with:
          name: fheroes2-windows-x64
          path: build/x64/Release-SDL2/fheroes2.exe
          if-no-files-found: error
