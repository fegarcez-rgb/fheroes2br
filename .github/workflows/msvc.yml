name: MSVC Windows

'on':
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: cmd
        run: script\windows\install_packages.bat

      - name: Install MSYS2 tools
        shell: cmd
        run: C:\msys64\usr\bin\pacman.exe -S --noconfirm --noprogressbar gettext-devel make

      - name: Generate version information
        shell: bash
        run: echo "FHEROES2APPVERSION=$(cat version.txt)" >> "$GITHUB_ENV"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build fheroes2
        shell: bash
        run: MSBuild.exe fheroes2-vs2019.vcxproj /property:Platform=x64 /property:Configuration=Release-SDL2 /property:BuildProjectReferences=true

      - name: Prepare Windows package
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path . -Filter fheroes2.exe -Recurse |
            Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' } |
            Select-Object -First 1

          if (-not $exe) {
            throw "fheroes2.exe não foi encontrado após a compilação."
          }

          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item $exe.FullName package\fheroes2.exe

          if (Test-Path files) {
            Copy-Item files package\files -Recurse
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: fheroes2-windows-x64
          path: package/
          if-no-files-found: error
